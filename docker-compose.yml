services:
  candidate-reviewer:
    build:
      context: .
    image: candidate-reviewer:latest
    container_name: candidate-reviewer
    env_file:
      - .env
    volumes:
      - /home/monis/.codex:/root/.codex
    ports:
      - "3000:3000"
    networks:
      - infra-net
    restart: unless-stopped

networks:
  infra-net:
    external: true
